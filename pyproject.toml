[project]
name = "asteroids"
version = "0.1.0"
description = "Arcade-style Asteroids game built with pygame, featuring weapons, powerups, bombs, and modular gameplay systems"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame==2.6.1",
]

[tool.bootdev]
run = "uv run main.py"